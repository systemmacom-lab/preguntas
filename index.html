<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Preguntas para Macom</title>
<style>
  :root {
    --fondo: #f5f7f8; --hoja: #ffffff; --texto: #1b2429; --suave: #56646c; --linea: #dbe2e6;
    --acento: #0f5d73;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #12181b; --hoja: #1a2226; --texto: #e4eaed; --suave: #9fb0b8; --linea: #2c383e;
      --acento: #7cc4d6;
      color-scheme: dark;
    }
  }
  body {
    margin: 0;
    background: var(--fondo);
    color: var(--texto);
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.55;
  }
  main { max-width: 46rem; margin: 0 auto; padding: 40px 16px 56px; display: grid; gap: 20px; }
  h1 { margin: 0; font-size: 32px; line-height: 1.15; }
  p { margin: 0; color: var(--suave); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  a {
    display: block;
    padding: 14px 16px;
    background: var(--hoja);
    border: 1px solid var(--linea);
    border-radius: 8px;
    color: var(--acento);
    font-weight: 600;
    text-decoration: none;
  }
  a span { color: var(--suave); font-weight: 400; }
  a:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Preguntas para Macom</h1>
  <p>Cada envío reúne las preguntas que necesito que me respondan para seguir construyendo el sistema.</p>
  <ul>
    <li><a href="e-01/">Envío E-01 <span>· 13 de noviembre de 2026 · 13 preguntas</span></a></li>
  </ul>
</main>
</body>
</html>
